# Continuous integration for the desktop application and the runner scripts.
#
# This workflow is not ceremony. Two things in this repository genuinely cannot
# be verified anywhere else:
#
#   * The Tauri application links the MSVC toolchain and WebView2, so it can only
#     be built on Windows.
#   * The vault's OS-level key wrapping calls DPAPI, which only exists on
#     Windows. The `nrvault` tests therefore run on both platforms: on Linux so a
#     failure is attributable to the pure-crypto code, and on Windows so the DPAPI
#     path and the page-locking code are actually executed rather than compiled
#     out.
#
# The size gate is enforced here because binary size regresses silently: nothing
# breaks, the download just grows.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Fail on warnings in CI so that a lint downgrade has to be deliberate.
  RUSTFLAGS: -D warnings

jobs:
  vault:
    name: vault tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: Test the vault
        working-directory: desktop
        run: cargo test -p nrvault --all-features

      - name: Test with optimisations
        # The release profile uses a different Argon2 backend path and a different
        # codegen profile, so a passing debug run is not sufficient evidence.
        working-directory: desktop
        run: cargo test -p nrvault --release

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Formatting
        working-directory: desktop
        run: cargo fmt --all -- --check

      # Clippy is deliberately not run here. `--workspace` pulls in `src-tauri`,
      # and compiling the Tauri crate on Linux means the whole GTK stack
      # (glib-sys, webkit2gtk-sys, libsoup) that this application does not use and
      # should not have installed: it is Windows-only by construction, from DPAPI
      # down to WebView2. Linting it on ubuntu therefore fails in glib-sys's build
      # script for a reason that says nothing about the code. It runs in the `app`
      # job instead, on the toolchain that actually produces the binary.

      - name: Shell script linting
        uses: ludeeus/action-shellcheck@master
        env:
          SHELLCHECK_OPTS: -e SC1091
        with:
          scandir: ./runner

      - name: Workflow linting
        uses: raven-actions/actionlint@v2

      - name: Icon is reproducible
        # The icon is a generated binary. If regenerating it changes the file, the
        # committed one is stale, and a stale binary in a security-sensitive build
        # is exactly the kind of drift that goes unnoticed for years.
        run: |
          python3 desktop/scripts/make-icon.py
          git diff --exit-code -- desktop/src-tauri/icons \
            || { echo "::error::src-tauri/icons is out of date; re-run desktop/scripts/make-icon.py"; exit 1; }

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install
        working-directory: desktop
        run: npm ci

      - name: Typecheck
        working-directory: desktop
        run: npm run typecheck

      - name: Build
        working-directory: desktop
        run: npx vite build

      - name: No runtime dependencies
        # The frontend is deliberately dependency-free: everything it renders comes
        # from an IPC call, and a supply-chain compromise of a UI library runs in
        # the same process that holds the unlocked session. This gate makes adding
        # one a reviewed decision rather than a careless `npm install`.
        working-directory: desktop
        run: |
          set -euo pipefail
          count=$(node -e "console.log(Object.keys(require('./package.json').dependencies || {}).length)")
          if [ "$count" != "0" ]; then
            echo "::error::the frontend must have zero runtime dependencies (found $count)"
            exit 1
          fi

  app:
    name: windows build
    runs-on: windows-latest
    needs: [vault, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Build the frontend
        # tauri-build resolves `frontendDist` at build time and refuses to embed a
        # directory that does not exist yet, so the bundle is produced before
        # anything that compiles the crate.
        working-directory: desktop
        run: npx vite build

      - name: Clippy
        working-directory: desktop
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test the application crate
        # The vault's tests run in their own job; these are the app's, and until
        # this step existed they were compiled by clippy and then never executed
        # anywhere. On Windows they can also reach DPAPI, which is the only
        # platform where that code path exists at all.
        working-directory: desktop
        run: cargo test -p node-runner

      - name: Build the application
        working-directory: desktop
        run: npm run tauri:build

      - name: Size gate
        shell: bash
        run: |
          set -euo pipefail
          # `desktop/` is the Cargo workspace root, so the target directory is
          # `desktop/target`, not `desktop/src-tauri/target`. Assuming the crate
          # directory is a quiet trap: the build succeeds, and this gate then
          # reports the binary as missing and skips the upload.
          exe="desktop/target/release/node-runner.exe"
          if [ ! -f "$exe" ]; then
            echo "::error::expected $exe to exist after the build"
            ls -l desktop/target/release/ || true
            exit 1
          fi
          bytes=$(stat -c %s "$exe")
          mib=$(( bytes / 1048576 ))
          echo "release executable: ${bytes} bytes (${mib} MiB)"

          # The target is under 5 MiB. That is achievable with opt-level="z",
          # LTO, panic=abort, strip, and an OS TLS stack instead of rustls; what
          # makes it *not* comfortably achievable is that it is measured against
          # a dynamically linked WebView2 and a statically linked HTTP client.
          # A hard failure at 5 MiB would therefore break the build for a reason
          # nobody can act on, so 5 MiB is a warning and 10 MiB is a failure: a
          # regression of that size means something large was pulled in by
          # accident, which is the failure this gate is actually for.
          warn_bytes=$((5 * 1048576))
          fail_bytes=$((10 * 1048576))

          if (( bytes > fail_bytes )); then
            echo "::error::the executable is ${mib} MiB, over the 10 MiB ceiling"
            exit 1
          fi
          if (( bytes > warn_bytes )); then
            echo "::warning::the executable is ${mib} MiB, over the 5 MiB target"
          fi

          {
            echo "### Build size"
            echo
            echo "| artifact | bytes | MiB |"
            echo "| --- | --- | --- |"
            echo "| node-runner.exe | ${bytes} | ${mib} |"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Upload the portable executable
        uses: actions/upload-artifact@v4
        with:
          name: node-runner-windows-x64
          path: |
            desktop/target/release/node-runner.exe
            desktop/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
          retention-days: 14
